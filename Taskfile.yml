version: '3'

vars:
  APP_NAME: "qterm"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  release:all:
    summary: Builds six portable macOS/Linux/Windows archives (amd64 and arm64)
    desc: |
      Runs the release orchestrator on macOS. Set DRY_RUN=true to print the
      preflight, cross-image, build, archive, and checksum plan without writing
      files or executing child tasks.
    cmds:
      - node build/release.mjs
    env:
      DRY_RUN: '{{.DRY_RUN | default "false"}}'

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  mirror:public:
    summary: 由当前 HEAD 生成公开仓快照（去注释、去测试、去文档与智能体产物）
    desc: |
      OUT 指定目标仓库目录（默认 ../Qterm-public，必须是 git 仓库或空目录）；
      VERIFY=true 时额外跑一次前端构建与 go build，确认去注释后的快照仍可构建；
      WORKTREE=true 时以工作区（含未提交/未跟踪文件）为来源——本地数据库被未提交的迁移
      升级过时必须这样做，否则快照只支持旧 schema，应用会拒绝启动。
    cmds:
      - node scripts/public-mirror.mjs --out {{.OUT | default "../Qterm-public"}} {{if eq .VERIFY "true"}}--verify{{end}} {{if eq .WORKTREE "true"}}--worktree{{end}}

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  format:
    summary: Formats Go and frontend source files
    cmds:
      - 'gofmt -w $(rg --files -g ''*.go'' -g ''!build/**'')'
      - npm --prefix frontend run format

  check:
    summary: Runs the complete local quality baseline
    cmds:
      - 'test -z "$(gofmt -l $(rg --files -g ''*.go'' -g ''!build/**''))"'
      - 'QTERM_MODULE=$(go list -m); go test $(go list ./... | rg -v "^${QTERM_MODULE}/(build|frontend)(/|$)")'
      - 'QTERM_MODULE=$(go list -m); go vet $(go list ./... | rg -v "^${QTERM_MODULE}/(build|frontend)(/|$)")'
      - npm --prefix frontend run check:all

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
