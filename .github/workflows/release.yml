name: release

# 推 `vX.Y.Z` tag 时产出「安装包 + 便携包 + SHA256SUMS」并创建 GitHub Release。
#
# 为什么是 Docker：产物的难点在跨平台工具链（macOS 的 .app/.dmg、Windows 的 NSIS、
# Linux 的 deb/rpm/AppImage）。这些都跑在同一个 Linux 打包镜像里（build/docker/Dockerfile.release），
# 版本号也只在这个流程里盖章（build/stamp-version.mjs），避免「界面新版本、安装包 0.0.1」。
#
# 两个 job 各跑一次镜像：amd64 出 darwin(两种架构) + windows(两种架构) + linux-amd64，
# arm64 只出 linux-arm64（linux 二进制必须在同架构容器里链接 GTK/WebKit，交叉链接会缺目标架构库）。
# 资产命名必须保留 `qterm-{os}-{arch}.{zip|tar.gz}`：应用内更新器按这个名字精确匹配
# （internal/update/github.go 的 assetNameFor），改名前先改那里。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（形如 v0.0.2）'
        required: true

permissions:
  contents: write

env:
  GO_VERSION_FILE: go.mod
  NODE_VERSION: '22'

jobs:
  package:
    name: package-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            targets: darwin,windows,linux
          - os: ubuntu-24.04-arm
            arch: arm64
            targets: linux
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动运行时以输入的 tag 为准；否则 checkout 默认分支会把手动发布
          # 错打成“默认分支当前代码 + 目标版本号”。推送 tag 时 ref_name 就是该 tag。
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Stamp version from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # NSIS 的原生版本字段要求数字；当前安装包流水线只发布稳定的三段版本。
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "发布标签必须为 vX.Y.Z 数字稳定版本；当前安装包不支持预发布或构建后缀。" >&2
            exit 1
          fi
          node build/stamp-version.mjs "${RELEASE_TAG#v}"

      # npm ci 只安装依赖；dist 不入库，必须在盖章后构建，才能把本次版本写入前端。
      # 两个架构都先生成宿主机产物，再由下面的 Docker 挂载读取。
      - name: Build frontend
        run: npm --prefix frontend run build

      # 打包镜像基于仓库自己的交叉编译镜像（zig + macOS SDK + GTK/WebKit 头文件）。
      - name: Build cross image
        run: docker build --platform linux/${{ matrix.arch }} -t wails-cross:latest -f build/docker/Dockerfile.cross build/docker

      - name: Build release image
        run: docker build --platform linux/${{ matrix.arch }} -t qterm-release -f build/docker/Dockerfile.release .

      - name: Package artifacts
        run: node build/release-docker.mjs --skip-frontend --skip-image --targets "${{ matrix.targets }}" --out "$PWD/bin/artifacts"

      - name: List artifacts
        run: ls -lh bin/artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: qterm-${{ matrix.arch }}
          path: |
            bin/artifacts/qterm-*.dmg
            bin/artifacts/qterm-*.zip
            bin/artifacts/qterm-*.tar.gz
            bin/artifacts/qterm-*.deb
            bin/artifacts/qterm-*.rpm
            bin/artifacts/qterm-*.AppImage
            bin/artifacts/qterm-*-setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # 发布 job 必须从同一个 tag checkout，避免 Release 内容与产物代码不一致。
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 两份 job 各上传一部分，校验和必须在合并后重新生成，否则会缺一半文件。
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          # 只对发布文件计算摘要，避免把正在写入的清单自身也算进去。
          export LC_ALL=C
          sha256sum qterm-* > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/qterm-*
            artifacts/SHA256SUMS
