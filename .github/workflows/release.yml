name: release

# 推 `vX.Y.Z` tag 时产出「安装包 + 便携包 + SHA256SUMS」并创建 GitHub Release。
#
# Docker 复用跨平台工具链，生成 macOS .app 中间 ZIP、Windows NSIS 和 Linux 安装包；
# 平台编译在同一个 Linux 打包镜像里完成（build/docker/Dockerfile.release），
# 版本号也只在这个流程里盖章（build/stamp-version.mjs），避免「界面新版本、安装包 0.0.1」。
#
# Docker 只负责 macOS 交叉编译中间包，签名 job 在 macOS 完成签名/复验/重新封装。
# 两个 job 各跑一次镜像：amd64 出 darwin(两种架构) + windows(两种架构) + linux-amd64，
# arm64 只出 linux-arm64（linux 二进制必须在同架构容器里链接 GTK/WebKit，交叉链接会缺目标架构库）。
# 资产命名必须保留 `qterm-{os}-{arch}.{zip|tar.gz}`：应用内更新器按这个名字精确匹配
# （internal/update/github.go 的 assetNameFor），改名前先改那里。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（形如 v0.0.2）'
        required: true

permissions:
  contents: write

env:
  GO_VERSION_FILE: go.mod
  NODE_VERSION: '22'

jobs:
  package:
    name: package-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            targets: darwin,windows,linux
            signing_flags: --defer-darwin-signing
          - os: ubuntu-24.04-arm
            arch: arm64
            targets: linux
            signing_flags: ""
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动运行时以输入的 tag 为准；否则 checkout 默认分支会把手动发布
          # 错打成“默认分支当前代码 + 目标版本号”。推送 tag 时 ref_name 就是该 tag。
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Stamp version from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # NSIS 的原生版本字段要求数字；当前安装包流水线只发布稳定的三段版本。
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "发布标签必须为 vX.Y.Z 数字稳定版本；当前安装包不支持预发布或构建后缀。" >&2
            exit 1
          fi
          node build/stamp-version.mjs "${RELEASE_TAG#v}"

      # npm ci 只安装依赖；dist 不入库，必须在盖章后构建，才能把本次版本写入前端。
      # 两个架构都先生成宿主机产物，再由下面的 Docker 挂载读取。
      - name: Build frontend
        run: npm --prefix frontend run build

      # 打包镜像基于仓库自己的交叉编译镜像（zig + macOS SDK + GTK/WebKit 头文件）。
      - name: Build cross image
        run: docker build --platform linux/${{ matrix.arch }} -t wails-cross:latest -f build/docker/Dockerfile.cross build/docker

      - name: Build release image
        run: docker build --platform linux/${{ matrix.arch }} -t qterm-release -f build/docker/Dockerfile.release .

      - name: Package artifacts
        run: node build/release-docker.mjs --skip-frontend --skip-image --targets "${{ matrix.targets }}" ${{ matrix.signing_flags }} --out "$PWD/bin/artifacts"

      - name: List artifacts
        run: ls -lh bin/artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: qterm-final-${{ matrix.arch }}
          path: |
            bin/artifacts/qterm-windows-*.zip
            bin/artifacts/qterm-windows-*-setup.exe
            bin/artifacts/qterm-linux-*.tar.gz
            bin/artifacts/qterm-linux-*.deb
            bin/artifacts/qterm-linux-*.rpm
            bin/artifacts/qterm-linux-*.AppImage
          if-no-files-found: error
          retention-days: 7

      # 待签名 ZIP 与可发布产物分开保存；publish 不会下载这个 artifact。
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'amd64'
        with:
          name: qterm-input-darwin
          path: bin/artifacts/qterm-darwin-*.zip
          if-no-files-found: error
          retention-days: 7

  sign-macos:
    name: sign-macos-adhoc
    needs: package
    # macOS 14 runner 已于 2026-11-02 退役；签名主机无需与产物架构一致。
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned Wails packaging tool
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - uses: actions/download-artifact@v4
        with:
          name: qterm-input-darwin
          path: bin/signed-artifacts
      - name: Sign apps and rebuild verified ZIP and DMG
        run: node build/darwin/finalize-artifacts.mjs bin/signed-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: qterm-final-darwin
          path: |
            bin/signed-artifacts/qterm-darwin-*.zip
            bin/signed-artifacts/qterm-darwin-*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [package, sign-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # 发布 job 必须从同一个 tag checkout，避免 Release 内容与产物代码不一致。
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          pattern: qterm-final-*
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify complete final artifact set
        run: |
          node --input-type=module <<'JS'
          import { validateArtifacts } from './build/release-docker.mjs'
          validateArtifacts('artifacts', { targets: 'darwin,windows,linux' }, 'x64')
          validateArtifacts('artifacts', { targets: 'linux' }, 'arm64')
          JS

      # 两份 job 各上传一部分，校验和必须在合并后重新生成，否则会缺一半文件。
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          # 只对发布文件计算摘要，避免把正在写入的清单自身也算进去。
          export LC_ALL=C
          sha256sum qterm-* > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Generate verified Homebrew Cask
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: >-
          node build/homebrew/generate-cask.mjs
          --repository "$RELEASE_REPOSITORY"
          --tag "$RELEASE_TAG"
          --artifacts artifacts
          --output artifacts/homebrew/qterm.rb

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/qterm-*
            artifacts/SHA256SUMS
            artifacts/homebrew/qterm.rb

      - uses: actions/upload-artifact@v4
        with:
          name: qterm-homebrew-cask
          path: artifacts/homebrew/qterm.rb
          if-no-files-found: error
          retention-days: 30

  update-homebrew-tap:
    name: update-homebrew-tap
    needs: publish
    if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: homebrew-tap-${{ vars.HOMEBREW_TAP_REPOSITORY }}
      cancel-in-progress: false
    steps:
      - name: Check Tap credentials
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN with Contents read/write access to the Tap repository."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: qterm-homebrew-cask
          path: homebrew
      - name: Update Casks/qterm.rb in the Tap
        uses: actions/github-script@v7
        env:
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          TAP_BRANCH: ${{ vars.HOMEBREW_TAP_BRANCH }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        with:
          github-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          script: |
            const fs = require('node:fs/promises')
            const repository = process.env.TAP_REPOSITORY
            if (!/^[A-Za-z0-9][A-Za-z0-9-]*\/[A-Za-z0-9][A-Za-z0-9._-]*$/.test(repository)) {
              throw new Error('HOMEBREW_TAP_REPOSITORY must be owner/repository')
            }
            const [owner, repo] = repository.split('/')
            const tag = process.env.RELEASE_TAG
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag)) throw new Error('Invalid release tag')
            const content = await fs.readFile('homebrew/qterm.rb', 'utf8')
            if (!content.includes(`  version "${tag.slice(1)}"`)) throw new Error('Cask version mismatch')
            const branch = process.env.TAP_BRANCH || (await github.rest.repos.get({ owner, repo })).data.default_branch
            // 新建空仓库必须先有初始提交；明确失败，避免意外写入其他分支。
            await github.rest.repos.getBranch({ owner, repo, branch })
            const path = 'Casks/qterm.rb'
            let current
            try {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: branch })
              current = response.data
              if (current.type !== 'file' || current.encoding !== 'base64') throw new Error('Unexpected Tap entry')
            } catch (error) {
              if (error.status !== 404) throw error
            }
            if (current) {
              const previous = Buffer.from(current.content, 'base64').toString('utf8')
              if (previous === content) {
                core.info('Tap already contains this Cask')
                return
              }
              const match = previous.match(/^  version "([0-9]+\.[0-9]+\.[0-9]+)"$/m)
              if (!match) throw new Error('Existing Cask has an unsupported version; review it manually')
              const oldParts = match[1].split('.').map(BigInt)
              const newParts = tag.slice(1).split('.').map(BigInt)
              const difference = newParts.map((part, index) => part - oldParts[index]).find(part => part !== 0n)
              if (difference < 0n) {
                core.notice('Skipping older release: Tap already has a newer version')
                return
              }
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `chore(cask): update Qterm to ${tag}`,
              content: Buffer.from(content).toString('base64'),
              ...(current ? { sha: current.sha } : {}),
            })
