name: release

# 推 `vX.Y.Z` tag 时产出「安装包 + 便携包 + SHA256SUMS」并创建 GitHub Release。
#
# Docker 复用跨平台工具链，生成 macOS .app 中间 ZIP、Windows NSIS 和 Linux 安装包；
# 平台编译在同一个 Linux 打包镜像里完成（build/docker/Dockerfile.release），
# 版本号也只在这个流程里盖章（build/stamp-version.mjs），避免「界面新版本、安装包 0.0.1」。
#
# Docker 只负责 macOS 交叉编译中间包，签名 job 在 macOS 完成签名/复验/重新封装。
# 两个 job 各跑一次镜像：amd64 出 darwin(两种架构) + windows(两种架构) + linux-amd64，
# arm64 只出 linux-arm64（linux 二进制必须在同架构容器里链接 GTK/WebKit，交叉链接会缺目标架构库）。
# 资产命名必须保留 `qterm-{os}-{arch}.{zip|tar.gz}`：应用内更新器按这个名字精确匹配
# （internal/update/github.go 的 assetNameFor），改名前先改那里。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（形如 v0.0.2）'
        required: true

permissions:
  contents: write
  # 下面 Fetch RDP helper 那步要用 gh api 查 rdp-helper 的运行、再用 gh run download
  # 取它的产物，这两类接口都归 actions 权限；不给的话会 403 然后静默退回"没有 helper"。
  actions: read

env:
  GO_VERSION_FILE: go.mod
  NODE_VERSION: '22'

jobs:
  package:
    name: package-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            targets: darwin,windows,linux
            signing_flags: --defer-darwin-signing
          - os: ubuntu-24.04-arm
            arch: arm64
            targets: linux
            signing_flags: ""
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动运行时以输入的 tag 为准；否则 checkout 默认分支会把手动发布
          # 错打成“默认分支当前代码 + 目标版本号”。推送 tag 时 ref_name 就是该 tag。
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Stamp version from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # NSIS 的原生版本字段要求数字；当前安装包流水线只发布稳定的三段版本。
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "发布标签必须为 vX.Y.Z 数字稳定版本；当前安装包不支持预发布或构建后缀。" >&2
            exit 1
          fi
          node build/stamp-version.mjs "${RELEASE_TAG#v}"

      # RDP helper 由独立的 rdp-helper workflow 在各自平台原生编出来（Linux/Windows 没法
      # 从 macOS 交叉产出可信产物）。这里**尽力**取同一个 commit 的 helper：
      # 缺了不影响发版，只是该平台的安装包不带 RDP（界面会提示"未安装 helper"）。
      # 想让它成为硬门槛：去掉下面的 continue-on-error，并把 package 的 needs 加上 rdp-helper。
      - name: Fetch RDP helper artifacts (optional)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 为什么不用 actions/download-artifact：它只能取「当前这次运行」的产物，而 helper
          # 由独立的 rdp-helper workflow 产出，于是这一步永远下载到空目录——2026-11-20 的
          # v0.0.12 发版包全都没有 RDP helper，日志里只剩一行"没有 RDP helper"。
          # 改成按同一个 commit 找到那次 rdp-helper 运行，等它跑完，再按 run-id 下载。
          run_id=""
          for attempt in $(seq 1 60); do
            run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/rdp-helper.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)
            if [ -n "$run_id" ]; then
              status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || echo unknown)
              echo "rdp-helper run ${run_id}: ${status}（第 ${attempt} 次检查）"
              if [ "$status" = "completed" ]; then break; fi
            else
              echo "还没找到 ${GITHUB_SHA} 的 rdp-helper 运行（第 ${attempt} 次检查）"
            fi
            sleep 30
          done
          if [ -z "$run_id" ]; then
            echo "没找到 rdp-helper 运行，本次包不带 RDP helper"
            exit 0
          fi
          rm -rf .cache/rdp-helpers
          if ! gh run download "$run_id" --dir .cache/rdp-helpers --pattern 'qterm-rdp-helper-*'; then
            echo "下载 rdp-helper 产物失败，本次包不带 RDP helper"
            exit 0
          fi
          find .cache/rdp-helpers -maxdepth 2 -type f | sort

      - name: Stage RDP helper for packaging (optional)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # 按「平台-架构」分目录：一次发版要出多个架构的包，而 helper 是目标架构的原生
          # 二进制。以前所有 artifact 合并到同一个扁平路径，后下载的会覆盖先下载的
          # （2026-11-19 事故：amd64 包里塞进 arm64 helper，用户机器上 exec format error）。
          dest_root=tools/rdp-helper-poc/freerdp/build
          mkdir -p "$dest_root"
          for artifact in .cache/rdp-helpers/qterm-rdp-helper-*; do
            [ -d "$artifact" ] || continue
            platform_arch=${artifact##*/qterm-rdp-helper-}
            for name in qterm-freerdp-helper qterm-freerdp-helper.exe; do
              [ -f "$artifact/$name" ] || continue
              mkdir -p "$dest_root/$platform_arch"
              cp "$artifact/$name" "$dest_root/$platform_arch/$name"
            done
          done
          find "$dest_root" -maxdepth 2 -type f | sort || true

      # npm ci 只安装依赖；dist 不入库，必须在盖章后构建，才能把本次版本写入前端。
      # 两个架构都先生成宿主机产物，再由下面的 Docker 挂载读取。
      - name: Build frontend
        run: npm --prefix frontend run build

      # 打包镜像基于仓库自己的交叉编译镜像（zig + macOS SDK + GTK/WebKit 头文件）。
      - name: Build cross image
        run: docker build --platform linux/${{ matrix.arch }} -t wails-cross:latest -f build/docker/Dockerfile.cross build/docker

      - name: Build release image
        run: docker build --platform linux/${{ matrix.arch }} -t qterm-release -f build/docker/Dockerfile.release .

      - name: Package artifacts
        run: node build/release-docker.mjs --skip-frontend --skip-image --targets "${{ matrix.targets }}" ${{ matrix.signing_flags }} --out "$PWD/bin/artifacts"

      - name: List artifacts
        run: ls -lh bin/artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: qterm-final-${{ matrix.arch }}
          path: |
            bin/artifacts/qterm-windows-*.zip
            bin/artifacts/qterm-windows-*-setup.exe
            bin/artifacts/qterm-linux-*.tar.gz
            bin/artifacts/qterm-linux-*.deb
            bin/artifacts/qterm-linux-*.rpm
            bin/artifacts/qterm-linux-*.AppImage
          if-no-files-found: error
          retention-days: 7

      # 待签名 ZIP 与可发布产物分开保存；publish 不会下载这个 artifact。
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'amd64'
        with:
          name: qterm-input-darwin
          path: bin/artifacts/qterm-darwin-*.zip
          if-no-files-found: error
          retention-days: 7

  sign-macos:
    name: sign-macos-adhoc
    needs: package
    # macOS 14 runner 已于 2026-11-02 退役；签名主机无需与产物架构一致。
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned Wails packaging tool
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - uses: actions/download-artifact@v4
        with:
          name: qterm-input-darwin
          path: bin/signed-artifacts
      - name: Sign apps and rebuild verified ZIP and DMG
        run: node build/darwin/finalize-artifacts.mjs bin/signed-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: qterm-final-darwin
          path: |
            bin/signed-artifacts/qterm-darwin-*.zip
            bin/signed-artifacts/qterm-darwin-*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [package, sign-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # 发布 job 必须从同一个 tag checkout，避免 Release 内容与产物代码不一致。
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          pattern: qterm-final-*
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify complete final artifact set
        run: |
          node --input-type=module <<'JS'
          import { validateArtifacts } from './build/release-docker.mjs'
          validateArtifacts('artifacts', { targets: 'darwin,windows,linux' }, 'x64')
          validateArtifacts('artifacts', { targets: 'linux' }, 'arm64')
          JS

      # 两份 job 各上传一部分，校验和必须在合并后重新生成，否则会缺一半文件。
      # 清单同时用 Ed25519 签名：应用内只内置公钥，因此替换 Release 产物也签不出能验过的清单
      # （私钥在 secret QTERM_UPDATE_SIGNING_KEY，绝不要提交到仓库）。
      - name: Generate and sign SHA256SUMS
        shell: bash
        env:
          QTERM_UPDATE_SIGNING_KEY: ${{ secrets.QTERM_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          node build/sign-update-manifest.mjs --artifacts artifacts
          cd artifacts
          export LC_ALL=C
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
          cat SHA256SUMS.sig

      - name: Generate verified Homebrew Cask
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: >-
          node build/homebrew/generate-cask.mjs
          --repository "$RELEASE_REPOSITORY"
          --tag "$RELEASE_TAG"
          --artifacts artifacts
          --output artifacts/homebrew/qterm.rb

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/qterm-*
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.sig
            artifacts/homebrew/qterm.rb

      - uses: actions/upload-artifact@v4
        with:
          name: qterm-homebrew-cask
          path: artifacts/homebrew/qterm.rb
          if-no-files-found: error
          retention-days: 30

  update-homebrew-tap:
    name: update-homebrew-tap
    needs: publish
    if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: homebrew-tap-${{ vars.HOMEBREW_TAP_REPOSITORY }}
      cancel-in-progress: false
    steps:
      - name: Check Tap credentials
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN with Contents read/write access to the Tap repository."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: qterm-homebrew-cask
          path: homebrew
      - name: Update Casks/qterm.rb in the Tap
        uses: actions/github-script@v7
        env:
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          TAP_BRANCH: ${{ vars.HOMEBREW_TAP_BRANCH }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        with:
          github-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          script: |
            const fs = require('node:fs/promises')
            const repository = process.env.TAP_REPOSITORY
            if (!/^[A-Za-z0-9][A-Za-z0-9-]*\/[A-Za-z0-9][A-Za-z0-9._-]*$/.test(repository)) {
              throw new Error('HOMEBREW_TAP_REPOSITORY must be owner/repository')
            }
            const [owner, repo] = repository.split('/')
            const tag = process.env.RELEASE_TAG
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag)) throw new Error('Invalid release tag')
            const content = await fs.readFile('homebrew/qterm.rb', 'utf8')
            if (!content.includes(`  version "${tag.slice(1)}"`)) throw new Error('Cask version mismatch')
            const branch = process.env.TAP_BRANCH || (await github.rest.repos.get({ owner, repo })).data.default_branch
            // 新建空仓库必须先有初始提交；明确失败，避免意外写入其他分支。
            await github.rest.repos.getBranch({ owner, repo, branch })
            const path = 'Casks/qterm.rb'
            let current
            try {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: branch })
              current = response.data
              if (current.type !== 'file' || current.encoding !== 'base64') throw new Error('Unexpected Tap entry')
            } catch (error) {
              if (error.status !== 404) throw error
            }
            if (current) {
              const previous = Buffer.from(current.content, 'base64').toString('utf8')
              if (previous === content) {
                core.info('Tap already contains this Cask')
                return
              }
              const match = previous.match(/^  version "([0-9]+\.[0-9]+\.[0-9]+)"$/m)
              if (!match) throw new Error('Existing Cask has an unsupported version; review it manually')
              const oldParts = match[1].split('.').map(BigInt)
              const newParts = tag.slice(1).split('.').map(BigInt)
              const difference = newParts.map((part, index) => part - oldParts[index]).find(part => part !== 0n)
              if (difference < 0n) {
                core.notice('Skipping older release: Tap already has a newer version')
                return
              }
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `chore(cask): update Qterm to ${tag}`,
              content: Buffer.from(content).toString('base64'),
              ...(current ? { sha: current.sha } : {}),
            })
